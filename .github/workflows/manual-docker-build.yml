name: Manual Docker Build and Push (ECR, static keys)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Docker image version tag to publish (e.g. 1.8.3)"
        required: true
      mark_latest:
        description: "Also tag and push the image as latest"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.version_tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # REMOVE the if condition - it's not needed since workflow_dispatch is the only trigger
    name: Build and push Docker image to Amazon ECR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}
      VERSION_TAG: ${{ github.event.inputs.version_tag }}
      # Fix boolean handling
      MARK_LATEST: ${{ github.event.inputs.mark_latest == true && 'true' || 'false' }}

    steps:
      - name: Check required secrets are present
        run: |
          set -euo pipefail
          [ -n "${AWS_REGION}" ] || { echo "Missing secret: AWS_REGION" >&2; exit 1; }
          [ -n "${ECR_REPOSITORY}" ] || { echo "Missing secret: AWS_ECR_REPOSITORY" >&2; exit 1; }
          [ -n "${ACCESS_KEY}" ] || { echo "Missing secret: AWS_ACCESS_KEY_ID" >&2; exit 1; }
          [ -n "${SECRET_KEY}" ] || { echo "Missing secret: AWS_SECRET_ACCESS_KEY" >&2; exit 1; }
        env:
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile exists (and show tree)
        run: |
          set -e
          test -f ./docker/Dockerfile || { echo "Dockerfile not found at ./docker/Dockerfile"; exit 1; }
          echo "::group::Top-level"; ls -la; echo "::endgroup::"
          echo "::group::docker/"; ls -la docker || true; echo "::endgroup::"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image tags
        id: prep-tags
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TAGS="${REGISTRY}/${ECR_REPOSITORY}:${VERSION_TAG}"
          if [ "${MARK_LATEST}" = "true" ]; then
            TAGS="${TAGS},${REGISTRY}/${ECR_REPOSITORY}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.prep-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add this to see build progress
          provenance: false

      - name: Summary
        if: always()
        run: |
          {
            echo "## Image pushed"
            echo "- Region: \`${{ env.AWS_REGION }}\`"
            echo "- Repository: \`${{ env.ECR_REPOSITORY }}\`"
            echo "- Version: \`${{ env.VERSION_TAG }}\`"
            echo "- Latest: \`${{ env.MARK_LATEST }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

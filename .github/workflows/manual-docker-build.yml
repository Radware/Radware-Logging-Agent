name: Manual Docker Build and Push (ECR, static keys)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Docker image version tag to publish (e.g. 1.8.3)"
        required: true
        type: string
      mark_latest:
        description: "Also tag and push the image as latest"
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    name: Build and push Docker image to Amazon ECR
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          echo "Checking secrets..."
          if [ -z "${{ secrets.AWS_REGION }}" ]; then echo "Missing AWS_REGION"; exit 1; fi
          if [ -z "${{ secrets.AWS_ECR_REPOSITORY }}" ]; then echo "Missing AWS_ECR_REPOSITORY"; exit 1; fi
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "Missing AWS_ACCESS_KEY_ID"; exit 1; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "Missing AWS_SECRET_ACCESS_KEY"; exit 1; fi
          echo "All secrets present"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY }}:${{ inputs.version_tag }}
            ${{ inputs.mark_latest && format('{0}/{1}:latest', steps.login-ecr.outputs.registry, secrets.AWS_ECR_REPOSITORY) || '' }}
          provenance: false

      - name: Success
        run: |
          echo "✅ Image pushed successfully"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "Repository: ${{ secrets.AWS_ECR_REPOSITORY }}"
          echo "Tag: ${{ inputs.version_tag }}"

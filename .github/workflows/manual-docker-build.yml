on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Docker image version tag to publish (e.g. 1.8.3)"
        required: true
      mark_latest:
        description: "Also tag and push the image as latest"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.version_tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' }} # belt & suspenders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        # ref: ${{ github.ref }}   # optional; default is the selected ref

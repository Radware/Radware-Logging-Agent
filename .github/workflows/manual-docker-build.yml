name: Manual Docker Build and Push (ECR, static keys)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Docker image version tag to publish (e.g. 1.8.3)"
        required: true
        type: string
      mark_latest:
        description: "Also tag and push the image as latest"
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare Docker tags based on input
        id: prep_tags
        run: |
          # Always include the version-specific tag from the input
          TAGS="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.event.inputs.version_tag }}"
          
          # Conditionally add the 'latest' tag if the user selected 'true'
          if [[ "${{ github.event.inputs.mark_latest }}" == 'true' ]]; then
            echo "✅ User chose to tag as 'latest'."
            TAGS="${TAGS}
          ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"
          else
            echo "☑️ User chose not to tag as 'latest'."
          fi
          
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${TAGS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.prep_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Manual Docker Build and Push (ECR, static keys)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Docker image version tag to publish (e.g. 1.8.3)"
        required: true
      mark_latest:
        description: "Also tag and push the image as latest"
        required: false
        default: false
        type: boolean

concurrency:
  group: ecr-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.inputs.version_tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}              # us-east-1
      ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY }}  # radware/rla
      VERSION_TAG: ${{ github.event.inputs.version_tag }}
      MARK_LATEST: ${{ github.event.inputs.mark_latest }}

    steps:
      - name: Check required secrets are present
        run: |
          set -euo pipefail
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || { echo "Missing secret: AWS_ACCESS_KEY_ID" >&2; exit 1; }
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || { echo "Missing secret: AWS_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "${AWS_REGION}" || { echo "Missing secret: AWS_REGION" >&2; exit 1; }
          test -n "${ECR_REPOSITORY}" || { echo "Missing secret: AWS_ECR_REPOSITORY" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image tags
        id: prep-tags
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          TAGS_LIST=("${REGISTRY}/${ECR_REPOSITORY}:${VERSION_TAG}")
          if [ "${MARK_LATEST}" = "true" ]; then
            TAGS_LIST+=("${REGISTRY}/${ECR_REPOSITORY}:latest")
          fi
          {
            echo "tags<<'TAGS'"
            for t in "${TAGS_LIST[@]}"; do echo "$t"; done
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.prep-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Image pushed"
            echo "- Region: \`${{ env.AWS_REGION }}\`"
            echo "- Repository: \`${{ env.ECR_REPOSITORY }}\`"
            echo "- Tags:"
            while IFS= read -r line; do echo "  - \`$line\`"; done <<< "${{ steps.prep-tags.outputs.tags }}"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

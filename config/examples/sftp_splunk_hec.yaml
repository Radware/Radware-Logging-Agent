general:
  log_file: "/var/log/rla/agent.log"
  output_directory: "/var/spool/rla/tmp"
  log_directory: "/var/log/rla"
  logging_levels: "INFO"

agents:
  - name: "sftp-splunk-hec"
    type: "sftp"
    product: "cloud_waap"
    sftp_settings:
      listen:
        host: "0.0.0.0"
        port: 2222
      host_keys:
        - "/etc/rla/ssh_host_ed25519_key"
      drop_directory: "/var/spool/rla/sftp/incoming"
      polling_interval_seconds: 5
      completion_strategy:
        mode: "archive"
        archive_directory: "/var/spool/rla/sftp/archive"
      credential_policy:
        mode: "public_key"
        users:
          - username: "splunk-partner"
            home_directory: "/var/spool/rla/sftp/incoming/splunk-partner"
            authorized_keys:
              - "/etc/rla/partners/splunk-partner.pub"
    logs:
      Access: true
      WAF: true
      Bot: true
      DDoS: true
      WebDDoS: true
      CSP: true
      unknown: true

output:
  output_format: "json"
  type: "https"
  destination: "splunk.example.com:8088/services/collector"
  batch: true
  compatibility_mode: "Splunk HEC"

https:
  verify: true
  custom_headers:
    Authorization: "Splunk CHANGE_ME_SPLUNK_HEC_TOKEN"

formats:
  json:
    time_format: "epoch_ms_str"
    unify_fields: true

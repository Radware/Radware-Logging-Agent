general:
  log_directory: "/var/log/rla"

agents:
  - name: "sftp-drop-zone"
    type: "sftp"
    product: "cloud_waap"
    sftp_settings:
      listen:
        host: "0.0.0.0"
        port: 2222
      host_keys:
        - "/etc/rla/ssh_host_ed25519_key"
      drop_directory: "/var/spool/rla/sftp/drop"
      polling_interval_seconds: 2
      completion_strategy:
        mode: "archive"
        archive_directory: "/var/spool/rla/sftp/archive"
      credential_policy:
        mode: "public_key"
        users:
          - username: "partner"
            home_directory: "/var/spool/rla/sftp/drop/partner"
            authorized_keys:
              - "/etc/rla/partners/partner.pub"
    logs:
      Access: true
      WAF: true
      Bot: true
      DDoS: true
      WebDDoS: true
      CSP: true
      unknown: true

output:
  output_format: "json"
  type: "tls"
  destination: "collector.example.com:6514"
  batch: true
  compatibility_mode: "none"

tls:
  verify: true
  ca_cert: "/etc/rla/tls/ca.pem"
  client_cert: "/etc/rla/tls/client.pem"
  client_key: "/etc/rla/tls/client.key"

formats:
  json:
    time_format: "ISO8601"
    unify_fields: true
